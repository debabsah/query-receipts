name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: pytest -q

  integration:
    # The dogfood gate: the full cure loop against live SQL Server 2022
    # and Postgres 16 — both certificates must come out PROVEN.
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: bash scripts/pgfleet_up.sh
      - run: bash scripts/fleetdb_up.sh
      - run: pytest -m integration -q
